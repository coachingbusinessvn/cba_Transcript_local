name: desktop-build

on:
  push:
    branches: [main, "feat/desktop-tauri", "1devtool/**"]
    paths:
      - "app/**"
      - "desktop/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "desktop/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

jobs:
  linux:
    name: linux-x64 (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: System deps (WebKitGTK etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool espeak-ng
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Python tests
        run: |
          uv sync --group desktop --group dev
          uv run ruff check .
          uv run pytest tests/ -v
      - name: Cargo unit tests (lib, no display required)
        run: |
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Build linux
        run: bash desktop/scripts/build-linux.sh
      - name: Require sidecar-manifest.json
        run: |
          test -f desktop/pyinstaller/dist/sidecar-manifest.json
          python3 - <<'PY'
          import json
          m = json.load(open("desktop/pyinstaller/dist/sidecar-manifest.json"))
          ff = m.get("ffmpeg") or {}
          assert ff.get("ffmpeg_license") in ("GPL", "LGPL"), ff
          assert ff.get("ffmpeg_version_line"), "missing version"
          assert ff.get("ffmpeg_configuration"), "missing configuration"
          assert ff.get("ffmpeg_sha256"), "missing sha"
          print("manifest OK", ff.get("ffmpeg_license"), ff.get("ffmpeg_version_line")[:80])
          PY
      - name: Sidecar e2e (headless)
        run: |
          uv run python scripts/e2e_sidecar_linux.py \
            --sidecar desktop/pyinstaller/dist/vitranscript-sidecar
      - name: Sidecar e2e offline (shared cache, --network none)
        run: |
          # Re-run with network namespace empty if unshare available; else skip with note.
          if command -v unshare >/dev/null 2>&1 && unshare -n true 2>/dev/null; then
            unshare -n -- uv run python scripts/e2e_sidecar_linux.py \
              --sidecar desktop/pyinstaller/dist/vitranscript-sidecar
          else
            echo "WARN: unshare -n not permitted on this runner; offline gate deferred"
          fi
      - name: Xvfb Tauri smoke (best-effort on artifact)
        run: |
          set -euo pipefail
          BIN=""
          if ls desktop/src-tauri/target/release/bundle/appimage/*.AppImage >/dev/null 2>&1; then
            BIN="$(ls desktop/src-tauri/target/release/bundle/appimage/*.AppImage | head -1)"
          elif [[ -x desktop/src-tauri/target/release/vitranscript ]]; then
            BIN="desktop/src-tauri/target/release/vitranscript"
          fi
          if [[ -z "${BIN}" ]]; then
            echo "ERROR: no AppImage or release binary for smoke" >&2
            exit 1
          fi
          bash scripts/smoke_desktop_linux.sh "${BIN}"
      - name: Clean Ubuntu 22.04 runtime gate (no system Python package assume)
        run: |
          # Sidecar is self-contained PyInstaller; verify it starts without uv/venv.
          BIN="desktop/pyinstaller/dist/vitranscript-sidecar"
          test -x "${BIN}"
          # Clear PATH to minimal — only keep essentials + the binary dir
          env -i PATH="/usr/bin:/bin" HOME="$HOME" \
            "${BIN}" --self-test-native
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitranscript-linux-x64
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/pyinstaller/dist/sidecar-manifest.json
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64 (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Cargo unit tests (lib)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Build macOS (native)
        run: bash desktop/scripts/build-macos.sh
      - name: Require sidecar-manifest.json
        run: test -f desktop/pyinstaller/dist/sidecar-manifest.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitranscript-macos-arm64
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/pyinstaller/dist/sidecar-manifest.json
          if-no-files-found: error

  macos-intel:
    name: macos-intel (macos-15-intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Cargo unit tests (lib)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Build macOS Intel (native)
        run: bash desktop/scripts/build-macos.sh
      - name: Require sidecar-manifest.json
        run: test -f desktop/pyinstaller/dist/sidecar-manifest.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitranscript-macos-x64
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/pyinstaller/dist/sidecar-manifest.json
          if-no-files-found: error

  windows:
    name: windows-x64 (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Cargo unit tests (lib)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --lib
      - name: Build Windows
        shell: pwsh
        run: .\desktop\scripts\build-windows.ps1
      - name: Require sidecar-manifest.json
        shell: pwsh
        run: |
          if (-not (Test-Path "desktop\pyinstaller\dist\sidecar-manifest.json")) {
            throw "missing sidecar-manifest.json"
          }
          $m = Get-Content "desktop\pyinstaller\dist\sidecar-manifest.json" -Raw | ConvertFrom-Json
          if (-not $m.ffmpeg.ffmpeg_license) { throw "missing ffmpeg_license" }
          if (-not $m.ffmpeg.ffmpeg_version_line) { throw "missing ffmpeg_version_line" }
          if (-not $m.ffmpeg.ffmpeg_configuration) { throw "missing ffmpeg_configuration" }
          Write-Host "manifest OK license=$($m.ffmpeg.ffmpeg_license)"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitranscript-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/pyinstaller/dist/sidecar-manifest.json
          if-no-files-found: error
