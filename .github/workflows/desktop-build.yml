name: desktop-build

on:
  push:
    branches: [main, "feat/desktop-tauri", "1devtool/**"]
    paths:
      - "app/**"
      - "desktop/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "desktop/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

jobs:
  linux:
    name: linux-x64 (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: System deps (WebKitGTK etc.)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            xvfb xdotool espeak-ng
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Python tests
        run: |
          uv sync --group desktop --group dev
          uv run ruff check .
          uv run pytest tests/ -v
      - name: Build linux
        run: bash desktop/scripts/build-linux.sh
      - name: Sidecar e2e (headless)
        run: |
          uv run python scripts/e2e_sidecar_linux.py \
            --sidecar desktop/pyinstaller/dist/vitranscript-sidecar
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitranscript-linux-x64
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/pyinstaller/dist/sidecar-manifest.json
          if-no-files-found: warn

  macos-arm64:
    name: macos-arm64 (macos-15)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build macOS (native)
        run: bash desktop/scripts/build-macos.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitranscript-macos-arm64
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/pyinstaller/dist/sidecar-manifest.json
          if-no-files-found: warn

  macos-intel:
    name: macos-intel (macos-15-intel)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build macOS Intel (native)
        run: bash desktop/scripts/build-macos.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitranscript-macos-x64
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/pyinstaller/dist/sidecar-manifest.json
          if-no-files-found: warn

  windows:
    name: windows-x64 (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI 2.11.4
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build Windows
        shell: pwsh
        run: .\desktop\scripts\build-windows.ps1
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vitranscript-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/**
            desktop/pyinstaller/dist/sidecar-manifest.json
          if-no-files-found: warn
